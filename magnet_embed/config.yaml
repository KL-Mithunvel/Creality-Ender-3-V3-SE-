# Default configuration.
#
# Machine-specific values (real COM ports, the MEASURED magnet-tool offset) belong
# in a git-ignored config.local.yaml next to this file; it is deep-merged over these
# defaults at load time. Do not put real ports or a tuned offset in this tracked file.

printer:
  port: COM3            # Windows device name; /dev/ttyUSB0 on Linux
  baud: 115200          # Ender-3 V3 SE
  ack_timeout_s: 30     # no `ok` and no busy/wait for this long -> AckTimeout
  connect_settle_s: 2.0 # wait after opening the port before the M115 handshake

dispenser:
  port: COM4            # Arduino Uno
  baud: 115200
  reset_settle_s: 2.5   # wait out the Uno auto-reset after opening the port

# Ender-3 V3 SE build volume (mm). Used for the insert-target envelope check.
machine:
  x_max: 220
  y_max: 220
  z_max: 250

# Fixed offset of the applicator holding pole from the nozzle tip (mm).
# MEASURE THIS on the real machine and override in config.local.yaml.
# Sign of z: +z means the pole tip sits ABOVE the nozzle tip.
magnet_tool_offset:
  x: 30.0
  y: 0.0
  z: 5.0

park:
  x: 5.0                # where the nozzle parks while the operator works
  y: 5.0
  safe_z_lift_mm: 15.0  # clearance above the tracked max print Z before any travel

temps:
  standby_nozzle_c: 160 # drop the nozzle here during the pause
  reheat_wait: true     # use M109 (wait) on resume
  nozzle_min_c: 0        # UI guard rail - Set Temp rejects targets outside this range
  nozzle_max_c: 260      # Sprite hotend safe ceiling; raise here (or config.local.yaml) if yours is rated higher
  bed_min_c: 0
  bed_max_c: 100         # V3 SE stock bed ceiling

travel:
  feed: 6000            # mm/min for non-print rapid moves (park, approach, resume)

retract:
  mm: 3.0
  feed: 2400            # mm/min

press:
  feed: 60              # mm/min, slow Z push into the pocket
  dwell_ms: 500

shear:
  distance: 5.0         # mm lateral move to slide the pole off the seated magnet
  feed: 1200            # mm/min

prime:
  mm: 2.0               # un-retract (+ a touch extra) on resume
  feed: 300

# Damage guard for the magnet insert (Dev Rules 7 + 12) - one function
# (`sequences.geometry.check_envelope`) used by the Plan dialog, the preview
# and the run itself. The pole is offset from the nozzle, so seating the magnet
# puts the NOZZLE somewhere else - possibly inside the printed part.
collision:
  nozzle_clearance_mm: 1.0   # nozzle tip must stay this far above the printed top while over the part
  footprint_margin_mm: 2.0   # grow the part's XY footprint (toolpath bbox) by this much before testing

sequence:
  max_retries: 3           # operator "retry" answers allowed before the insert aborts

ui:
  idle_poll_s: 2.0         # panel auto-refreshes position + temps this often while idle; 0 disables
  live_view_poll_s: 0.15   # panel redraws the embedded live-print view this often during a run; 0 disables

# Z-offset ("paper test") calibration - the "Z Calibrate..." panel button.
# probe_z_offset is the value the APP trusts as the printer's current M851 Z
# offset (config is the source of truth here, same pattern as magnet_tool_offset
# below - NOT read back from the firmware, since the exact M851 report format
# for this printer's firmware fork is unverified). Check your printer's real
# value once (send a bare `M851` from a terminal) and set it here before the
# first calibration, or the saved offset will drift from what the firmware
# actually has stored.
zcal:
  x: 110.0                 # bed-center XY the nozzle travels to for the paper test
  y: 110.0
  start_z: 5.0              # safe Z above the bed before the fine nudge-down starts
  step_mm: 0.05              # default nudge step shown in the dialog
  feed: 100                 # mm/min for the fine Z nudge moves - deliberately slow
  probe_z_offset: 0.0       # MEASURE THIS - the printer's real M851 Z offset

gcode:
  sentinel_token: ";MAGNET_INSERT"
  require_sentinel: false   # if true, a run that reaches EOF with no sentinel errors
